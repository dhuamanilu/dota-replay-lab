[project]
name = "dota-replay-lab"
version = "0.1.0"
description = "Local, reproducible experiments for learning Dota 2 decisions from public replays."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Diego Alonso Huamani Luque" },
]

[project.optional-dependencies]
ml = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "xgboost>=2.1",
]
dev = [
  "luaparser>=4.0",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
